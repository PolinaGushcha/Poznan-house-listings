name: Run a command on the server via SSM
description: Sends a shell script to the EC2 instance with AWS Systems Manager, waits for it and prints the output. Fails unless the command succeeds.
inputs:
  instance-id:
    description: EC2 instance ID
    required: true
  script:
    description: Shell script to run on the server
    required: true
  comment:
    description: Short label shown in the SSM console
    required: false
    default: github-actions
  timeout-seconds:
    description: Maximum run time
    required: false
    default: '900'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INSTANCE_ID: ${{ inputs.instance-id }}
        SCRIPT: ${{ inputs.script }}
        COMMENT: ${{ inputs.comment }}
        TIMEOUT: ${{ inputs.timeout-seconds }}
      run: |
        set -euo pipefail
        PARAMS="$(jq -n --arg s "$SCRIPT" --arg t "$TIMEOUT" '{commands: [$s], executionTimeout: [$t]}')"
        CMD_ID="$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name AWS-RunShellScript \
          --comment "${COMMENT:0:100}" \
          --parameters "$PARAMS" \
          --query Command.CommandId --output text)"
        echo "SSM command: $CMD_ID"
        DEADLINE=$(( $(date +%s) + TIMEOUT + 60 ))
        STATUS=Pending
        while [ "$(date +%s)" -lt "$DEADLINE" ]; do
          sleep 5
          STATUS="$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text 2>/dev/null || echo Pending)"
          case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
        done
        aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
          --query StandardOutputContent --output text || true
        echo "----- stderr -----"
        aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
          --query StandardErrorContent --output text || true
        echo "Final status: $STATUS"
        [ "$STATUS" = "Success" ]
