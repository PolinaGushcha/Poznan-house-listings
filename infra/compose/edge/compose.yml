# Reverse proxy shared by production and staging on the single server (ADR-002).
# Automatic HTTPS certificates (Let's Encrypt) — no load balancer needed.
name: phl-edge
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    env_file: /opt/phl/edge/.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

networks:
  edge:
    external: true

volumes:
  caddy-data:
  caddy-config:
