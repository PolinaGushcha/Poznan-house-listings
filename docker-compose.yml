# Local development only. Production and staging use infra/compose/.
services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64 # no arm64 image exists; Docker Desktop on Apple Silicon emulates it (same image as the server)
    environment:
      POSTGRES_USER: phl
      POSTGRES_PASSWORD: phl-local-password # local development only
      POSTGRES_DB: phl_dev
    ports:
      - '5433:5432' # 5433 on the Mac, so it never clashes with another local PostgreSQL on 5432
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phl -d phl_dev']
      interval: 5s
      retries: 10

  mail:
    image: axllent/mailpit:latest # catches outgoing email locally: http://localhost:8025
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  db-data:
